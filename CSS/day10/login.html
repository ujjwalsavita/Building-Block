<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <h2>Login Page</h2>

        <label for="user">Username : </label>
        <input type="text" id="user" name="username" placeholder="Enter Your username" required>

        <label for="pass">Password : </label>
        <input type="password" id="pass" name="password" placeholder="Enter your Password" required>
        
        <Button class="btn">Login</Button>

        <p class="forget">Forget password</p>
        <div class="auth">
            <div>Google</div>
            <div>facebook</div>
        </div>

        <p>Click here to <a href="signup.html">Singup</a></p>



    </form>
    
</body>
</html>
