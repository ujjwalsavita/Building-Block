<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form action="process.php" method="post">

    <!-- Full Name: Added autofocus, minlength/maxlength, required, and pattern for alphabets -->
    <label>Full Name:</label><br>
    <input type="text" 
           name="fullname" 
           placeholder="Enter full name" 
           autofocus 
           required 
           minlength="3" 
           maxlength="50" 
           pattern="[A-Za-z\s]+" 
           title="Name must contain letters only."><br><br>

    <!-- Email Address: Required -->
    <label>Email Address:</label><br>
    <input type="email" 
           name="email" 
           placeholder="example@email.com" 
           required><br><br>

    <!-- Phone Number: Changed to type="tel" with pattern enforcing exactly 10 digits -->
    <label>Phone Number:</label><br>
    <input type="tel" 
           name="phone" 
           placeholder="10-digit mobile number" 
           required 
           pattern="[0-9]{10}" 
           title="Please enter a valid 10-digit mobile number."><br><br>

    <!-- Date of Birth: Restricted using min and max bounds -->
    <label>Date of Birth:</label><br>
    <input type="date" 
           name="dob" 
           required 
           min="1950-01-01" 
           max="2018-12-31"><br><br>

    <!-- Radio Buttons: Required attached to radio group -->
    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male" required> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>

    <!-- Checkboxes -->
    <label>Subjects Enrolled:</label><br>
    <input type="checkbox" name="sub1" value="html"> HTML
    <input type="checkbox" name="sub2" value="css"> CSS
    <input type="checkbox" name="sub3" value="javascript"> JavaScript
    <br><br>

    <!-- Dropdown: Required added -->
    <label>Select City:</label><br>
    <select name="city" required>
        <option value=""> -- Select -- </option>
        <option value="nagpur">Nagpur</option>
        <option value="mumbai">Mumbai</option>
        <option value="pune">Pune</option>
    </select><br><br>

    <!-- Textarea: Added required, minlength, and maxlength -->
    <label>Address:</label><br>
    <textarea name="address" 
              rows="4" 
              cols="40" 
              placeholder="Enter your full address" 
              required 
              minlength="10" 
              maxlength="200"></textarea>
    <br><br>

    <!-- File Upload: Required added -->
    <label>Upload Photo:</label><br>
    <input type="file" name="photo" accept="image/*" required><br><br>

    <!-- Buttons -->
    <input type="submit" value="Register Now">
    <input type="reset" value="Clear Form">

</form>

</body>
</html>
