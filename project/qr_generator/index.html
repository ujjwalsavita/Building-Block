<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <h1>QR Generator</h1>
        <p>Enter a Text & URL to generate QR</p>
        <input type="text" placeholder="Text URL" id="url">
        <button id="btn" onclick="generator()">Generate QR</button>

        <div id="qrBox">
            <img src="" alt="" id="qr">
            
        </div>

        <div id="message"></div>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
